spring:
  application:
    name: citytop-canal-sync
  main:
    web-application-type: none
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${CITYTOP_DB_URL:jdbc:mysql://127.0.0.1:13306/sql_store?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CITYTOP_DB_USERNAME:canal_sync}
    password: ${CITYTOP_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
  redis:
    host: ${CITYTOP_REDIS_HOST:127.0.0.1}
    port: ${CITYTOP_REDIS_PORT:16379}
    password: ${CITYTOP_REDIS_PASSWORD:}
    timeout: 3s
    lettuce:
      pool:
        max-active: 4
        max-idle: 2
        min-idle: 1
citytop:
  canal:
    host: ${CANAL_SERVER_HOST:127.0.0.1}
    port: ${CANAL_SERVER_PORT:11111}
    destination: ${CANAL_DESTINATION:citytop}
    username: ${CANAL_USERNAME:}
    password: ${CANAL_PASSWORD:}
    subscription: ${CANAL_SUBSCRIPTION:sql_store\.(tb_shop|tb_seckill_voucher|tb_voucher_order)}
    batch-size: ${CANAL_BATCH_SIZE:200}
    polling-timeout-millis: ${CANAL_POLLING_TIMEOUT_MILLIS:1000}
    reconnect-delay-millis: ${CANAL_RECONNECT_DELAY_MILLIS:3000}
    verify-delay-millis: ${CANAL_VERIFY_DELAY_MILLIS:1500}
    retry:
      fixed-delay-millis: ${CANAL_RETRY_FIXED_DELAY_MILLIS:2000}
      batch-size: ${CANAL_RETRY_BATCH_SIZE:100}
      max-attempts: ${CANAL_RETRY_MAX_ATTEMPTS:8}
      base-delay-seconds: ${CANAL_RETRY_BASE_DELAY_SECONDS:2}
logging:
  level:
    root: info
    com.citytop.canalsync: debug
  file:
    name: logs/canal-sync.log
