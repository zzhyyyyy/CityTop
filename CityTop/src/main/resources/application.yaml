server:
  port: 8081
spring:
  application:
    name: CityTop
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://8.163.27.12/sql_store?useSSL=false&serverTimezone=UTC
    username: root
    password: 20031121zzh.
  redis:
    host: 8.163.27.12
    port: 6379
    password: 20031121zzh.
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
rocketmq:
  name-server: localhost:9876
  producer:
    group: seckill-order-producer-group
citytop:
  search:
    elasticsearch:
      # 默认走 MySQL 兼容检索；部署 Elasticsearch 后改为 true。
      enabled: false
  websocket:
    # 生产环境请替换为前端实际域名，多个域名以逗号分隔。
    allowed-origins: http://localhost:8080,http://localhost:5173
    notification-executor:
      # 在线通知属于尽力而为的实时推送；队列满时记录告警但不影响点赞等主业务。
      core-pool-size: 2
      max-pool-size: 8
      queue-capacity: 500
      keep-alive-seconds: 60
      shutdown-await-seconds: 10
  xxl-job:
    # 默认关闭；部署 xxl-job-admin 后改为 true 并填写 admin-addresses。
    enabled: false
    admin-addresses: http://127.0.0.1:8080/xxl-job-admin
    appname: citytop-executor
    port: 9999
    log-path: ./logs/xxl-job
    log-retention-days: 30
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.CityTop.entity # 别名扫描包
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.CityTop: debug

